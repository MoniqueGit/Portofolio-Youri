];

function BlocEditeur({ b, onChange, onDelete }) {
  const meta = TYPES_BLOC.find((x) => x.t === b.type) || TYPES_BLOC[0];
  return (
    <div className="blk">
      <div className="hd">
        <span className="tag"><Ic n={meta.i} s={12} />{meta.l}</span>
        <button className="btn sm ghost danger" onClick={onDelete}><Ic n="trash" s={12} /></button>
      </div>
      {b.type === "saut" ? <span className="muted">La page suivante démarre ici.</span> : null}
      {b.type === "figure" ? (
        <>
          {b.src ? <img src={b.src} alt="" /> : null}
          <label className="btn sm" style={{ alignSelf: "flex-start", cursor: "pointer" }}>
            <Ic n="up" s={12} />{b.src ? "Remplacer l’image" : "Choisir une image"}
            <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => {
              const f = e.target.files[0]; if (!f) return;
              const r = new FileReader(); r.onload = () => onChange({ src: r.result }); r.readAsDataURL(f);
              e.target.value = "";
            }} />
          </label>
          <T value={b.caption || ""} onChange={(v) => onChange({ caption: v })}
             placeholder="Légende — numérotée automatiquement" />
        </>) : null}
      {b.type === "tableau" ? (
        <>
          <Auto value={b.content || ""} onChange={(v) => onChange({ content: v })} min={70}
                placeholder={"Une ligne par rangée, colonnes séparées par |\nBroche | Signal | Niveau\nPA5 | SCK | 3,3 V"} />
          <T value={b.caption || ""} onChange={(v) => onChange({ caption: v })} placeholder="Légende (optionnelle)" />
        </>) : null}
      {b.type === "code" ? (
        <>
          <Auto value={b.content || ""} onChange={(v) => onChange({ content: v })} min={80}
                placeholder="Collez votre code…" />
          <T value={b.caption || ""} onChange={(v) => onChange({ caption: v })} placeholder="Légende (optionnelle)" />
        </>) : null}
      {b.type === "encadre" ? (
        <>
          <T value={b.caption || ""} onChange={(v) => onChange({ caption: v })} placeholder="Intitulé de l’encadré" />
          <Auto value={b.content || ""} onChange={(v) => onChange({ content: v })} min={64} />
        </>) : null}
    </div>
  );
}

function SectionCard({ state, dispatch, index, claude, running, onGenerate }) {
  const p = state.plan[index];
  const sec = state.sections[p.id] || blankSection();
  const extrait = extraitPour(state, p.id);
  const nums = numeroter(state.plan);
  const [consigne, setConsigne] = useState("");
  const [err, setErr] = useState("");
  const w = words(sec.text);
  const tags = { vide: ["", "vide"], run: ["run", "en cours"], ok: ["ok", "généré"], edit: ["edit", "édité à la main"] };
  const [cls, lbl] = sec.locked ? ["lock", "verrouillé"] : (tags[sec.status] || tags.vide);

  const lancer = async (extra) => {
    setErr("");
    try { await onGenerate(p.id, extra); } catch (e) { setErr(msgErreur(e)); }
  };
  const setBlocs = (blocks) => dispatch({ t: "sec", id: p.id, v: { blocks } });

  return (
    <div className="sec" data-lock={sec.locked ? 1 : 0}>
      <header>
        <span className="num">{nums[index]}</span>
        <span className="t">{p.title}</span>
        <span className={"tag " + cls}>{lbl}</span>
        {extrait ? <span className="tag ok" title="mise au propre du brouillon">
          brouillon · {words(extrait)} mots</span> : null}
        <span className="tag mono">{w} / {p.words} mots</span>
        <button className="btn sm ghost" title={sec.locked ? "Déverrouiller" : "Verrouiller"}
                onClick={() => dispatch({ t: "sec", id: p.id, v: { locked: !sec.locked } })}>
          <Ic n={sec.locked ? "lock" : "unlock"} s={13} />
        </button>
      </header>
      <div className="body">
        {p.intent ? <p className="muted" style={{ margin: 0 }}>{p.intent}</p> : null}
        {extrait ? (
          <details className="det">
            <summary>Brouillon rattaché à cette section — {words(extrait)} mots, repris tels quels</summary>
            <div className="ex">{extrait}</div>
            <button className="btn sm ghost" style={{ marginTop: 8 }}
                    onClick={() => {
                      const r = { ...(state.repartition || {}) };
                      delete r[p.id];
                      dispatch({ t: "repartition", v: r });
                    }}>
              <Ic n="x" s={12} />Détacher — rédiger sans le brouillon
            </button>
          </details>) : null}
        <Auto value={sec.text} min={100}
              onChange={(v) => dispatch({ t: "sec", id: p.id, v: { text: v, status: v ? "edit" : "vide" } })}
              placeholder="Rien pour l’instant. Générez, ou écrivez directement." />
        <Erreur e={err} onRetry={() => lancer(consigne)} />
        <div className="tools">
          <button className="btn sm pri" disabled={running || sec.locked} onClick={() => lancer("")}>
            <Ic n="spark" s={13} />
            {sec.text ? "Régénérer" : extrait ? "Mettre au propre" : "Rédiger"}
          </button>
          <T value={consigne} onChange={setConsigne} style={{ flex: 1, minWidth: 170 }}
             placeholder="Consigne — « plus technique », « raccourcis de moitié », « ajoute un exemple STM32 »" />
          <button className="btn sm" disabled={running || sec.locked || !consigne.trim()}
                  onClick={() => lancer(consigne)}>
            <Ic n="refresh" s={13} />Appliquer
          </button>
        </div>
        <div className="tools">
          <span className="eyebrow">Blocs non générés</span>
          {TYPES_BLOC.map((b) => (
            <button className="btn sm ghost" key={b.t}
                    onClick={() => setBlocs([...(sec.blocks || []), { id: uid(), type: b.t, content: "", caption: "" }])}>
              <Ic n={b.i} s={12} />{b.l}
            </button>
          ))}
        </div>
        {(sec.blocks || []).length ? (
          <div className="blocks">
            {sec.blocks.map((b) => (
              <BlocEditeur key={b.id} b={b}
                onChange={(v) => setBlocs(sec.blocks.map((x) => x.id === b.id ? { ...x, ...v } : x))}
                onDelete={() => setBlocs(sec.blocks.filter((x) => x.id !== b.id))} />
            ))}
          </div>) : null}
      </div>
    </div>
  );
}

/* ============================ application ============================ */
function App() {
  const [state, dispatch] = useReducer(reducer, undefined, initial);
  const claude = useClaude();
  const pagination = usePagination(state);
  const [zoom, setZoom] = useState(0.55);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0, label: "" });
  const [globalErr, setGlobalErr] = useState("");
  const abortRef = useRef(null);
  const stopRef = useRef(false);
  const stateRef = useRef(state);
  stateRef.current = state;

  /* --- un appel = une section --- */
  const genererSection = useCallback(async (id, extra) => {
    const state = stateRef.current;               // toujours l’état le plus frais
    const idx = state.plan.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const p = state.plan[idx];
    const nums = numeroter(state.plan);
    const precedentes = state.plan.slice(0, idx)
      .map((q, j) => {
        const t = (state.sections[q.id] || {}).text;
        return t ? nums[j] + " " + q.title + " : " + resume(t) : null;
      }).filter(Boolean);
    const actuel = (state.sections[id] || {}).text;
    const extrait = extraitPour(state, id);

    const prompt = [
      ANTI_IA,
      "",
      contexteGlobal(state),
      "",
      "=== PLAN COMPLET DU DOSSIER ===",
      blocPlan(state),
      "",
      precedentes.length ? "=== CE QUI EST DÉJÀ ÉCRIT (résumés) ===\n" + precedentes.join("\n") : "",
      state.echantillon.trim()
        ? "\n=== ÉCHANTILLON DE L’ÉCRITURE DE L’AUTEUR — IMITE CE STYLE ===\n" + cut(state.echantillon, 3000)
        : "",
      extrait
        ? "\n=== BROUILLON DE L’ÉQUIPE POUR CETTE SECTION — MATIÈRE PREMIÈRE ===\n" + cut(extrait, 7000) +
          "\n\nMODE MISE AU PROPRE. Ce brouillon est la seule source de vérité factuelle." +
          "\nReformule-le pour qu’il réponde aux consignes du professeur et tienne la longueur visée." +
          "\nGarde ses chiffres, ses références de composants et ses détails concrets à l’identique :" +
          "\nne les arrondis pas, ne les « améliore » pas. N’ajoute aucun fait qui n’y figure pas." +
          "\nSi le brouillon ne dit rien d’un point attendu par les consignes, pose un marqueur" +
          "\n[[À COMPLÉTER : …]] à l’endroit exact plutôt que de combler toi-même." +
          "\nSi une phrase du brouillon relève d’une autre section, ignore-la sans la recaser ici."
        : "",
      "",
      "=== SECTION À RÉDIGER MAINTENANT — ET ELLE SEULE ===",
      nums[idx] + " " + p.title,
      "Intention : " + (p.intent || "non précisée"),
      "Longueur : environ " + p.words + " mots.",
      actuel && extra ? "\nVersion actuelle à retravailler :\n" + cut(actuel, 4000) : "",
      extra ? "\nConsigne de réécriture : " + extra : "",
      "",
      "Ne rédige que cette section. N’anticipe pas sur les suivantes, ne répète pas les précédentes.",
    ].filter((x) => x !== "").join("\n");

    dispatch({ t: "sec", id, v: { status: "run" } });
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    let dernier = 0;
    try {
      const r = await claude.ask(prompt, {
        modelTier: "complex",
        signal: ctrl.signal,
        onText: (u) => {
          const now = Date.now();
          if (now - dernier < 220) return;        // le flux entier repaginerait à chaque delta
          dernier = now;
          dispatch({ t: "sec", id, v: { text: u.text, status: "run" } });
        },
      });
      dispatch({ t: "sec", id, v: { text: (r.text || "").trim(), status: "ok" } });
      if (r.truncated)
        setGlobalErr("La section « " + p.title + " » a été coupée par la limite de longueur. Réduisez sa cible en mots ou découpez-la en deux.");
    } catch (e) {
      const t = (stateRef.current.sections[id] || {}).text;
      dispatch({ t: "sec", id, v: { status: t ? "edit" : "vide" } });
      throw e;
    } finally { abortRef.current = null; }
  }, [claude]);

  /* --- enchaînement séquentiel --- */
  const toutGenerer = async () => {
    const cibles = stateRef.current.plan.filter((p) => !(stateRef.current.sections[p.id] || {}).locked);
    setRunning(true); stopRef.current = false; setGlobalErr("");
    setProgress({ done: 0, total: cibles.length, label: "" });
    for (let i = 0; i < cibles.length; i++) {
      if (stopRef.current) break;
      setProgress({ done: i, total: cibles.length, label: cibles[i].title });
      try { await genererSection(cibles[i].id, ""); }
      catch (e) {
        if (e && e.code === "cancelled") break;
        setGlobalErr("Arrêt sur « " + cibles[i].title + " » — " + msgErreur(e));
        break;
      }
    }
    setProgress((p) => ({ ...p, done: p.total, label: "" }));
    setRunning(false);
  };
  const stopper = () => {
    stopRef.current = true;
    if (abortRef.current) abortRef.current.abort();
    setRunning(false);
  };

  /* --- export / sauvegarde --- */
  const enregistrer = async (nom, data, mime) => {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename: nom, data }); return; } catch (e) { /* refus ou indisponible */ } }
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = nom; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  const exportMarkdown = () => {
    const nums = numeroter(state.plan);
    const L = ["# " + (state.meta.titre || "Dossier")];
    if (state.meta.sousTitre) L.push("_" + state.meta.sousTitre + "_");
    L.push("");
    state.plan.forEach((p, i) => {
      L.push((p.level === 1 ? "## " : "### ") + nums[i] + " " + p.title, "");
      const sec = state.sections[p.id] || blankSection();
      if (sec.text) L.push(sec.text, "");
      (sec.blocks || []).forEach((b) => {
        if (b.type === "code") L.push("```", b.content || "", "```", "");
        else if (b.type === "tableau") L.push((b.content || "").split("\n").map((r) => "| " + r + " |").join("\n"), "");
        else if (b.type === "figure") L.push("![" + (b.caption || "") + "](figure)", "");
        else if (b.type === "encadre") L.push("> " + (b.caption ? "**" + b.caption + "** — " : "") + (b.content || ""), "");
        else L.push("<!-- saut de page -->", "");
      });
    });
    enregistrer(fichier("md"), L.join("\n"), "text/markdown");
  };
  const fichier = (ext) => (state.meta.titre || "dossier").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "").slice(0, 50) + "." + ext;
  const sauver = () => enregistrer(fichier("json"), JSON.stringify(state, null, 2), "application/json");
  const charger = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        if (!j || !Array.isArray(j.plan)) throw new Error("structure inattendue");
        dispatch({ t: "load", state: { ...initial(), ...j, sections: j.sections || {} } });
        setGlobalErr("");
      } catch (e) {
        setGlobalErr("Ce fichier n’est pas un projet valide (" + e.message + ").");
      }
    };
    r.readAsText(file);
  };

  const listeTrous = useMemo(() => trous(state), [state.plan, state.sections]);
  const motsTotal = state.plan.reduce((a, p) => a + words((state.sections[p.id] || {}).text), 0);
  const faits = state.plan.filter((p) => (state.sections[p.id] || {}).text).length;

  const ETAPES = ["Configuration", "Plan", "Rédaction", "Export"];
  // index = étape visée. L’écran du plan est toujours atteignable, sinon on ne
  // pourrait jamais y construire le plan qu’il exigeait.
  const peutAvancer = [true, true, state.plan.length > 0, faits > 0];
  const blocage = [null, null,
    state.plan.length ? null : "Construisez d’abord le plan.",
    faits ? null : "Rédigez au moins une section avant l’export."];

  const apercu = (
    <div className="card" style={{ padding: 0 }}>
      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                       padding: "9px 12px", borderBottom: "1px solid var(--line)", background: "var(--panel)" }}>
        <span className="eyebrow">Aperçu A4 · {1 + pagination.tocPages + pagination.pages.length} pages</span>
        <div className="zoombar">
          <button className="btn sm ghost" onClick={() => setZoom((z) => clamp(z - 0.1, 0.25, 1.2))}>−</button>
          <span className="mono muted">{Math.round(zoom * 100)} %</span>
          <button className="btn sm ghost" onClick={() => setZoom((z) => clamp(z + 0.1, 0.25, 1.2))}>+</button>
        </div>
      </header>
      <div className="docscroll">
        <div className="docwrap" style={{ zoom: zoom }}>
          <DocPreview state={state} pagination={pagination} />
        </div>
      </div>
    </div>
  );

  return (
    <div className="app">
      <div className="app-chrome">
        <div className="topbar">
          <div className="topbar-in">
            <div className="brand"><span className="dot" />{NOM_APP}</div>
            <nav className="steps">
              {ETAPES.map((e, i) => (
                <React.Fragment key={e}>
                  {i ? <span className="step-sep" /> : null}
                  <button className="step" data-on={state.step === i ? 1 : 0}
                          data-done={state.step > i ? 1 : 0}
                          onClick={() => dispatch({ t: "step", v: i })}>
                    <span className="n">{i + 1}</span>{e}
                  </button>
                </React.Fragment>
              ))}
            </nav>
            <div className="topacts">
              <button className="btn sm ghost" title="Charger un squelette de rapport de projet"
                      onClick={() => dispatch({ t: "load", state: exemple() })}>
                <Ic n="eye" s={13} />Exemple
              </button>
              <button className="btn sm" onClick={sauver}><Ic n="save" s={13} />Sauvegarder</button>
              <label className="btn sm" style={{ cursor: "pointer" }}>
                <Ic n="folder" s={13} />Charger
                <input type="file" accept=".json" style={{ display: "none" }}
                       onChange={(e) => { const f = e.target.files[0]; if (f) charger(f); e.target.value = ""; }} />
              </label>
              <button className="btn sm pri" onClick={() => window.print()}><Ic n="print" s={13} />Imprimer / PDF</button>
            </div>
          </div>
        </div>

        <div className={"shell" + (state.step === 1 ? " wide" : "")}>
          <div className="pane">
            {globalErr ? <Erreur e={globalErr} /> : null}
            {claude.mode === "http" ? (
              <div className="note">
                Déploiement autonome : la génération passe par la fonction <code>/api/claude</code>.
                Si les boutons restent muets, c’est que la variable d’environnement
                <strong> ANTHROPIC_API_KEY</strong> n’est pas configurée côté serveur.
                L’édition, la mise en page et l’export PDF fonctionnent sans elle.
              </div>) : null}

            {state.step === 0 ? <EcranConfig state={state} dispatch={dispatch} claude={claude} /> : null}
            {state.step === 1 ? <EcranPlan state={state} dispatch={dispatch} claude={claude} /> : null}

            {state.step === 2 ? (
              <>
                <Card title="Rédaction" kicker={faits + " / " + state.plan.length + " sections · " + motsTotal + " mots"}
                  right={
                    <div className="row">
                      {running
                        ? <button className="btn sm danger" onClick={stopper}><Ic n="stop" s={12} />Stopper</button>
                        : <button className="btn sm pri" disabled={!state.plan.length} onClick={toutGenerer}>
                            <Ic n="play" s={12} />Tout générer</button>}
                    </div>}>
                  {running ? (
                    <>
                      <div className="bar"><i style={{ width: (progress.total ? (progress.done / progress.total) * 100 : 0) + "%" }} /></div>
                      <span className="muted">
                        {progress.done} / {progress.total}{progress.label ? " — " + progress.label : ""}
                      </span>
                    </>) : (
                    <p className="muted" style={{ margin: 0 }}>
                      Une section = un appel. Le contexte transmis contient les consignes, vos métadonnées,
                      le plan entier et un résumé des sections déjà écrites. Les sections verrouillées sont ignorées.
                    </p>)}
                </Card>

                {listeTrous.length ? (
                  <Card title="Trous à combler" kicker={listeTrous.length + " marqueurs"}>
                    <div className="holes">
                      {listeTrous.map((h, i) => (
                        <div className="hole" key={i}><b>{h.où}</b>{h.quoi}</div>
                      ))}
                    </div>
                  </Card>) : null}

                <div className="vstack">
                  {state.plan.map((p, i) => (
                    <SectionCard key={p.id} state={state} dispatch={dispatch} index={i} claude={claude}
                                 running={running} onGenerate={genererSection} />
                  ))}
                </div>
                {!state.plan.length ? (
                  <Card title="Rien à rédiger">
                    <p className="muted" style={{ margin: 0 }}>Construisez d’abord le plan à l’étape 2.</p>
                  </Card>) : null}
              </>) : null}

            {state.step === 3 ? (
              <Card title="Export">
                <p className="muted" style={{ margin: 0 }}>
                  L’impression utilise la mise en page exacte de l’aperçu : A4, marges réglées,
                  en-tête et pied répétés, numérotation, figures et tableaux jamais coupés.
                  Dans la boîte d’impression, choisissez <strong>Enregistrer au format PDF</strong>,
                  décochez les en-têtes du navigateur et laissez les marges sur « aucune ».
                </p>
                <div className="row">
                  <button className="btn pri" onClick={() => window.print()}><Ic n="print" s={14} />Imprimer / PDF</button>
                  <button className="btn" onClick={exportMarkdown}><Ic n="dl" s={14} />Export Markdown</button>
                  <button className="btn" onClick={sauver}><Ic n="save" s={14} />Sauvegarder le projet (.json)</button>
                </div>
                <div className="grid3" style={{ marginTop: 4 }}>
                  {[["Pages", 1 + pagination.tocPages + pagination.pages.length],
                    ["Mots rédigés", motsTotal],
                    ["Trous restants", listeTrous.length]].map(([l, v]) => (
                    <div key={l} style={{ border: "1px solid var(--line)", borderRadius: 8, padding: "10px 12px" }}>
                      <div className="eyebrow">{l}</div>
                      <div className="mono" style={{ fontSize: 22, fontWeight: 600 }}>{v}</div>
                    </div>
                  ))}
                </div>
                {listeTrous.length ? (
                  <div className="note">
                    {listeTrous.length} marqueur{listeTrous.length > 1 ? "s" : ""} « à compléter » subsiste
                    {listeTrous.length > 1 ? "nt" : ""} dans le texte. Ils apparaissent surlignés en jaune
                    dans l’aperçu et seront imprimés tels quels.
                  </div>) : null}
              </Card>) : null}

            <div className="row" style={{ justifyContent: "space-between", marginTop: 2 }}>
              <button className="btn" disabled={state.step === 0}
                      onClick={() => dispatch({ t: "step", v: state.step - 1 })}>
                <Ic n="left" s={14} />Retour
              </button>
              <div className="row">
                {state.step < 3 && blocage[state.step + 1]
                  ? <span className="muted">{blocage[state.step + 1]}</span> : null}
                <button className="btn pri" disabled={state.step === 3 || !peutAvancer[state.step + 1]}
                        onClick={() => dispatch({ t: "step", v: state.step + 1 })}>
                  {state.step < 3 ? ETAPES[state.step + 1] : "Suivant"}<Ic n="right" s={14} />
                </button>
              </div>
            </div>
          </div>

          {state.step !== 1 ? <div className="pane sticky">{apercu}</div> : null}
        </div>
        {pagination.host}
      </div>

      <div className="print-root">
        <DocPreview state={state} pagination={pagination} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
(function () {
  var root = document.getElementById("root");
  function fail(msg) {
    root.innerHTML = '<div class="boot"><strong>Impossible de démarrer l’atelier.</strong><p>' + msg +
      '</p><p style="color:#5b6168">Rechargez la page. Si le problème persiste, un CDN est bloqué par votre réseau.</p></div>';
  }
  function load(urls, done) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return done(new Error("aucune source disponible"));
      var s = document.createElement("script");
      s.src = urls[i++];
      s.onload = function () { done(null); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  }
  var CDNJS = "https://cdnjs.cloudflare.com/ajax/libs/";
  var JSD = "https://cdn.jsdelivr.net/npm/";
  load([CDNJS + "react/18.3.1/umd/react.production.min.js", JSD + "react@18.3.1/umd/react.production.min.js"], function (e) {
    if (e) return fail("React n’a pas pu être chargé.");
    load([CDNJS + "react-dom/18.3.1/umd/react-dom.production.min.js", JSD + "react-dom@18.3.1/umd/react-dom.production.min.js"], function (e2) {
      if (e2) return fail("React DOM n’a pas pu être chargé.");
      load([JSD + "@babel/standalone@7.26.4/babel.min.js", JSD + "@babel/standalone@7/babel.min.js",
            CDNJS + "babel-standalone/7.26.4/babel.min.js"], function (e3) {
        if (e3 || !window.Babel) return fail("Le compilateur JSX n’a pas pu être chargé.");
        try {
          var src = document.getElementById("app-src").textContent;
          var out = window.Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
          new Function(out)();
        } catch (err) {
          fail("Erreur à la compilation : " + (err && err.message ? err.message : err));
        }
      });
    });
  });
})();
</script>
