  <body>
    <script>
      // Pendant de client/public/404.html : GitHub Pages ne sert pas les routes
      // profondes, 404.html les réécrit en « ?p=chemin », on les restaure ici
      // avant que l'application ne démarre.
      (function () {
        var q = window.location.search;
        if (q.indexOf('?p=') !== 0) return;
        var parts = q.slice(1).split('&');
        var route = decodeURIComponent(parts.shift().slice(2)).replace(/~and~/g, '&');
        var rest = parts.join('&').replace(/^q=/, '').replace(/~and~/g, '&');
        window.history.replaceState(
          null,
          '',
          window.location.pathname.replace(/\/$/, '') + '/' + route +
            (rest ? '?' + rest : '') + window.location.hash
        );
      })();
    </script>

  </body>
